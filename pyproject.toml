[project]
name = "parametrized-interactive-quantum-classifiers"
version = "0.1.0"
description = "Code for parametrized interactive quantum classifier experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.6",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "optax>=0.2.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
pso = [
    "pyswarms>=1.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
]
